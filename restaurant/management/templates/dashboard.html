{% extends 'base.html' %}
{% load static %}

{% block content %}
    <h2 class="text-center body-main-heading mt-4">Administrator Dahsboard</h2>

    <section class="container my-5">

        {% if dashboard_items %}
        <div class="row">
            {% for element in dashboard_items %}
            <article class="col-sm-12 col-md-6 mb-4">
                <div class="card h-100 d-flex flex-column border-0 shadow-sm">
                    <!-- Background image section -->
                    <div class="menu-image-container d-flex align-items-center justify-content-center position-relative" 
                        style="background-image: url('{% static element.image_url %}'); 
                                background-size: contain; 
                                background-position: center; 
                                background-repeat: no-repeat;
                                height: 250px;
                                border-radius: 15px 15px 0 0;">
                    </div>

                    <div class="card-body d-flex flex-column p-3">
                        <a href="{{ element.url }}" class="btn">
                            <h5 class="card-title mb-2 text-center body-secondary-heading">{{ element.item|title }}</h5>
                        </a>                        
                    </div>

                </div>
            </article>
            {% endfor %}





        </div>
        {% endif %}

{% endblock %}
