{% extends 'base.html' %}

{% block content %}
<section class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow-sm border-0 p-4">
                <div class="card-body">
                    <h3 class="card-title text-danger mb-3">Cancel Reservation</h3>
                    <p>Are you sure you want to cancel your reservation for <strong>{{ booking.booking_date|date:"d M Y" }}</strong> at <strong>{{ booking.booking_time|time:"H:i" }}</strong>?</p>
                    
                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3">
                            <a href="{% url 'bookings:user_bookings' %}" class="btn btn-secondary">Keep Reservation</a>
                            <button type="submit" class="btn btn-danger">Confirm Cancellation</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
